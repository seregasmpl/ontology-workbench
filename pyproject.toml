[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-workbench"
version = "0.1.0"
description = "Local expert-led ontology and text annotation workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.20", "keyring>=25,<27", "pyarrow>=18,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
ontology-workbench = "workbench.launcher:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
